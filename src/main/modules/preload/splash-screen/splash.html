<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPLC Editor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" />
    <style>
        :root {
            --bg: #023c97;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.8);
            --bar-bg: rgba(255, 255, 255, 0.18);
            --bar-fill: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text);
            font-size: 10px;
            font-weight: 500;
            user-select: none;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background-color: transparent;
            padding: 28px 32px 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 18px;
        }

        .brand img {
            display: block;
            width: 450px;
            max-width: 100%;
            height: auto;
            -webkit-app-region: no-drag;
            user-select: none;
            pointer-events: none;
        }

        .info {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
            line-height: 1.5;
        }

        .company {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .loading {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .copyright {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            max-width: 760px;
        }

        .loadContainer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 5px;
            background-color: var(--bar-bg);
        }

        .loadbar {
            width: 0%;
            height: 100%;
            background: var(--bar-fill);
            transition: width 0.9s ease-out;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="brand">
            <img src="../../../../frontend/assets/icons/about/logo.svg" alt="OpenPLC logo" />
        </div>

        <div class="info">
            <div class="company">Ningbo Huizhen Technology Co., Ltd.</div>
            <div class="loading">Loading...</div>
            <div class="copyright">Original OpenPLC Editor Copyright (c) 2021-2025 Autonomy-Logic. All rights reserved.
            </div>
            <div class="copyright">Modified version Copyright (c) 2026 Ningbo Huizhen. All rights reserved.</div>
        </div>

        <div class="loadContainer">
            <div class="loadbar" id="progressBar"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar')
            let progress = 0
            const interval = setInterval(() => {
                progress += 6
                if (progress > 100) {
                    clearInterval(interval)
                    progressBar.style.width = '100%'
                    return
                }
                progressBar.style.width = `${progress}%`
            }, 120)
        })
    </script>
</body>

</html>
